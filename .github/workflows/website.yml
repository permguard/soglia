# Checks that the VitePress site in `website/` builds, then asks permguard/permguard to republish.
#
# The Soglia site is served at docs.permguard.com/soglia, and that domain belongs to
# permguard/permguard: its `website` workflow builds the Permguard documentation and this site
# together and deploys them as one Pages site. This repository therefore publishes nothing itself.
# A push to `main` sends that workflow a `soglia-docs` repository dispatch, so a change here goes
# live in minutes instead of at the next daily rebuild.
#
# The dispatch needs the `DOCS_DISPATCH_TOKEN` secret: a fine-grained token limited to
# permguard/permguard with the Contents read and write permission, which is what a repository
# dispatch requires.

name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install
        run: npm ci
      - name: build
        run: npm run docs:build

  publish:
    name: republish docs.permguard.com
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: dispatch the permguard website workflow
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::DOCS_DISPATCH_TOKEN is not set, so docs.permguard.com/soglia will only update at the daily rebuild."
            exit 1
          fi
          gh api --method POST repos/permguard/permguard/dispatches -f event_type=soglia-docs
