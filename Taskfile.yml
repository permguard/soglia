version: '3'

# Tasks are kept in alphabetical order, so a reader scanning the file finds them in series.
tasks:
  build:
    desc: Build every component.
    summary: |
      Build every component.

      Examples:
        task build
        task build PKG=soglia-core
        task build RELEASE=1

      Parameters:
        PKG      Build only this workspace crate. Default: the whole workspace.
        RELEASE  Build with the release profile when set to any value. Default: unset.
        ARGS     Extra flags appended verbatim to `cargo build`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      RELEASE: '{{.RELEASE | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo build {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}}
        {{if .RELEASE}}--release{{end}} {{.ARGS}}

  check:
    desc: Run every check the pipeline runs.
    summary: |
      Run lint, the structural checks (licence headers, third-party notices, build-system parity,
      Phase-0 dependencies), the supply-chain gates and the test suite, in that order.

      Example:
        task check
    cmds:
      - task: lint
      - task: check:headers
      - task: check:notices
      - task: check:systems
      - task: check:phase0-deps
      - task: check:supply-chain
      - task: test

  check:headers:
    desc: Check that every source file carries the licence header.
    cmds:
      - ./scripts/check-license-headers.sh

  check:notices:
    desc: Check that THIRD_PARTY_NOTICES.md matches the dependency graph.
    cmds:
      - ./scripts/third-party-notices.sh --check

  check:phase0-deps:
    desc: Check that the binary links no PIC, gRPC, eBPF or TLS crate (T10).
    cmds:
      - ./scripts/check-phase0-dependencies.sh

  check:supply-chain:
    desc: Check advisories, licences, duplicate crates and sources with cargo-deny.
    cmds:
      - cargo deny check advisories licenses bans sources

  check:systems:
    desc: Check that the Makefile and the Taskfile offer the same commands.
    cmds:
      - ./scripts/check-build-systems.sh

  clean:
    desc: Remove build artifacts. STALE=7 removes only what nothing has touched for 7 days.
    summary: |
      Remove build artifacts.

      Examples:
        task clean
        task clean STALE=7

      Parameters:
        STALE  Remove only what nothing has touched for this many days, with cargo-sweep.
               Default: unset, which runs `cargo clean`.
    vars:
      STALE: '{{.STALE | default ""}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.STALE}}" ]; then
          if ! command -v cargo-sweep >/dev/null 2>&1; then
            echo "cargo-sweep is not installed: cargo install cargo-sweep" >&2
            exit 1
          fi
          # Keeps what a rebuild would otherwise redo, drops what only history is holding on to.
          cargo sweep --time "{{.STALE}}"
        else
          cargo clean
        fi

  coverage:
    desc: Measure test coverage and enforce the 60% per-crate line floor.
    cmds:
      - ./scripts/check-coverage.sh

  coverage:html:
    desc: Measure coverage and open the annotated-source HTML report.
    cmds:
      - cargo llvm-cov --workspace --html --open

  coverage:lcov:
    desc: Write coverage as lcov.info, for editors and CI uploaders.
    cmds:
      - cargo llvm-cov --workspace --lcov --output-path lcov.info

  dev:image:
    desc: Build the Linux development and test image.
    cmds:
      - docker build -t soglia-dev:local dev/linux

  fmt:
    desc: Format the code.
    cmds:
      - cargo fmt --all

  notices:
    desc: Regenerate THIRD_PARTY_NOTICES.md from the resolved dependency graph.
    cmds:
      - ./scripts/third-party-notices.sh

  lint:
    desc: Check formatting and run clippy with warnings denied.
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  spike:delete-vms:
    interactive: true
    desc: Stop and delete every soglia-spike* Lima VM (asks first; YES=1 skips the question).
    summary: |
      Stop and delete the old spike VM, the development VM and every replay VM: every Lima VM
      whose name starts with `soglia-spike`, and nothing else. Evidence lives in the repository
      on the host, so it survives. Deleting a VM cannot be undone.

      Examples:
        task spike:delete-vms
        task spike:delete-vms YES=1
    vars:
      YES: '{{.YES | default ""}}'
    cmds:
      - ./spikes/cgroup-bpf/host/delete-vms.sh {{if .YES}}--yes{{end}}

  spike:doctor:
    interactive: true
    desc: Check the cgroup-BPF spike environment on the development VM (created if missing).
    summary: |
      Create or start the development VM `soglia-spike-dev`, provision it, build the spike inside
      Linux, and run the runner's `doctor` checks. Runs from macOS; needs limactl and jq.
      Lima's prompts are answered automatically; INTERACTIVE=1 shows them instead.

      Examples:
        task spike:doctor
        task spike:doctor INTERACTIVE=1
    vars:
      INTERACTIVE: '{{.INTERACTIVE | default "0"}}'
    env:
      SOGLIA_SPIKE_INTERACTIVE: '{{.INTERACTIVE}}'
    cmds:
      - ./spikes/cgroup-bpf/host/run-dev.sh doctor

  spike:b1:
    interactive: true
    desc: Run authoritative production B1 once on a newly created Lima VM.
    summary: |
      Create one fresh VM named `soglia-spike-b1-<id>`, provision it, build the production binary
      with the cgroup-BPF feature, and execute B1 only. The VM is left in place and B2-B7 are never
      started. Evidence goes to spikes/cgroup-bpf/evidence/replay/.

      Example:
        task spike:b1
    cmds:
      - ./spikes/cgroup-bpf/host/run-b1-fresh.sh

  spike:b2:diagnostic:
    interactive: true
    desc: Run diagnostic production B2 on the reusable development VM.
    summary: |
      Create or reuse `soglia-spike-dev`, build the production Candidate-A backend and its
      qualification harness, and execute B2 diagnostically. This never creates authoritative
      evidence and never starts B3-B7.

      Example:
        task spike:b2:diagnostic
    cmds:
      - ./spikes/cgroup-bpf/host/run-b2-diagnostic.sh

  spike:replay:
    interactive: true
    desc: Run the authoritative S0-S14 replay on two newly created VMs, one after the other.
    summary: |
      Create two fresh VMs (`soglia-spike-replay-<id>-r1` and `-r2`), provision and build each, and
      run the whole suite on both. Stops at the first non-PASS result. The VMs are left in place;
      list them with `task spike:vms` and remove them with `limactl delete <name>`.
      Evidence goes to spikes/cgroup-bpf/evidence/replay/, which git ignores.
      Lima's prompts are answered automatically; INTERACTIVE=1 shows them instead.

      Examples:
        task spike:replay
        task spike:replay INTERACTIVE=1
    vars:
      INTERACTIVE: '{{.INTERACTIVE | default "0"}}'
    env:
      SOGLIA_SPIKE_INTERACTIVE: '{{.INTERACTIVE}}'
    cmds:
      - ./spikes/cgroup-bpf/host/run-fresh.sh

  spike:run:
    interactive: true
    desc: Run spike tests diagnostically on the development VM (default ONLY=s0).
    summary: |
      Run one test (`ONLY`) or every test from one onwards (`FROM`) on `soglia-spike-dev`.
      Diagnostic runs are recorded as `authoritative: false`; use `task spike:replay` for the
      authoritative run.

      Examples:
        task spike:run
        task spike:run ONLY=s1
        task spike:run FROM=s8

      Parameters:
        ONLY         Run only this test. Default: s0.
        FROM         Run from this test to the end; takes precedence over ONLY. Default: unset.
        INTERACTIVE  1 shows Lima's prompts instead of answering them. Default: 0.
    vars:
      ONLY: '{{.ONLY | default "s0"}}'
      FROM: '{{.FROM | default ""}}'
      INTERACTIVE: '{{.INTERACTIVE | default "0"}}'
    env:
      SOGLIA_SPIKE_INTERACTIVE: '{{.INTERACTIVE}}'
    cmds:
      - >-
        ./spikes/cgroup-bpf/host/run-dev.sh run
        {{if .FROM}}--from {{.FROM}}{{else}}--only {{.ONLY}}{{end}}

  spike:vms:
    desc: List the Lima VMs of the cgroup-BPF spike.
    cmds:
      - limactl list | awk 'NR == 1 || /soglia-spike/'

  test:
    desc: Run the unprivileged test suite.
    summary: |
      Run the unprivileged test suite.

      Examples:
        task test
        task test PKG=soglia-core
        task test FILTER=ownership

      Parameters:
        PKG     Test only this workspace crate. Default: the whole workspace.
        FILTER  Only run tests whose name contains this string. Default: all tests.
        ARGS    Extra flags appended verbatim to `cargo test`. Default: empty.
    vars:
      PKG: '{{.PKG | default ""}}'
      FILTER: '{{.FILTER | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - >-
        cargo test {{if .PKG}}-p {{.PKG}}{{else}}--workspace{{end}} --locked {{.ARGS}}
        {{.FILTER}}

  test:acceptance:
    desc: Run the privileged Phase-0 suite (T1-T10, H1-H4) in the Linux development environment.
    summary: |
      Run every privileged test — the network and sandbox backends against a real kernel, and the
      Phase-0 acceptance suite against a running `soglia`. Inside the devcontainer it runs in place;
      anywhere else it runs in a fresh privileged development container.

      Example:
        task dev:image
        task test:acceptance
    cmds:
      - dev/linux/acceptance.sh

  test:portable:
    desc: Run the tests of the crates that build on any system (soglia-core, soglia-proxy).
    summary: |
      Lint and test the crates that are plain logic and build natively on macOS too. The other
      crates build only on Linux: use the devcontainer or `dev/linux/run.sh` for them.

      Examples:
        task test:portable
        task test:portable FILTER=hostname

      Parameters:
        FILTER  Only run tests whose name contains this string. Default: all tests.
        ARGS    Extra flags appended verbatim to `cargo test`. Default: empty.
    vars:
      FILTER: '{{.FILTER | default ""}}'
      ARGS: '{{.ARGS | default ""}}'
    cmds:
      - cargo clippy -p soglia-core -p soglia-proxy --all-targets --locked -- -D warnings
      - cargo test -p soglia-core -p soglia-proxy --locked {{.ARGS}} {{.FILTER}}
