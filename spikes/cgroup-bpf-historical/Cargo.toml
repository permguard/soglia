# The Phase-1 cgroup-BPF spike. EXPERIMENTAL: not part of the product.
#
# Its own workspace and lock file, excluded from the product workspace, so nothing here reaches the
# Phase-0 dependency graph. It reuses the product's crates by path to rebuild the real topology.

[workspace]
resolver = "3"
members = ["harness", "agent"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
