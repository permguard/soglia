# The host bootstrap replaces __SOGLIA_REPOSITORY__ in a temporary copy.

minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu-24.04

vmType: vz
arch: aarch64
cpus: 4
memory: 8GiB
disk: 40GiB

mounts:
  - location: "__SOGLIA_REPOSITORY__"
    mountPoint: /soglia
    writable: true

containerd:
  system: false
  user: false
