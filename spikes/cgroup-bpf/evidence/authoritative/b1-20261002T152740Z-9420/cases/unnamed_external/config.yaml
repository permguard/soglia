runtime:
  uid: 65534
  gid: 65534
  state_dir: /run/soglia-b1-unnamed
  max_concurrency: 2
  max_queue: 2
  max_ingress_connections: 4
  cleanup_failure_threshold: 1
  teardown_timeout_ms: 5000
  runc: /usr/sbin/runc
  nft: /usr/sbin/nft
  ip: /usr/sbin/ip
  bpftool: /usr/sbin/bpftool
ingress: { listen: "127.0.0.1:18097" }
network:
  backend: cgroup-bpf
  execution_pool: 10.231.0.0/24
  proxy_address: 10.200.255.1
  proxy_port: 15001
  max_proxy_connections: 64
cgroup: { root: "/sys/fs/cgroup/system.slice/soglia-b1-unnamed.service" }
cgroup_bpf:
  max_tracked_sockets: 64
  resolve_timeout_ms: 2000
  ring_buffer_bytes: 65536
  max_pending_resolves: 64
  resolve_workers: 4
  pin_root: /sys/fs/bpf/soglia-b1-unnamed
agents:
  probe:
    rootfs: /var/empty
    command: ["/bin/false"]
