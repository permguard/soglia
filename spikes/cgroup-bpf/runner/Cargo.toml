[package]
name = "soglia-spike-runner"
description = "Authoritative runner for the reproducible cgroup-BPF spike. EXPERIMENTAL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aya = "0.14"
nix = { version = "0.30", features = ["sched", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
soglia-core = { path = "../../../crates/soglia-core" }
soglia-proxy = { path = "../../../crates/soglia-proxy" }
soglia-supervisor = { path = "../../../crates/soglia-supervisor" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
